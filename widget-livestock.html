function opSubmit(f) {
function fe(n) { return f.querySelector('[name=' + n + ']'); }
var st = f.querySelector('.mff-os'), btn = f.querySelector('.mff-send');
function v(n) { return (fe(n).value || '').trim(); }
st.className = 'mff-os';
if (fe('botcheck').value) return;
if (!CART.length) { st.className = 'mff-os mff-err'; st.textContent = 'Your order list is empty.'; return; }
if (!v('name')) { st.className = 'mff-os mff-err'; st.textContent = 'Please enter your name.'; fe('name').focus(); return; }
if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('email'))) { st.className = 'mff-os mff-err'; st.textContent = 'Please enter a valid email so we can confirm your order.'; fe('email').focus(); return; }
if (v('email').toLowerCase() !== v('email2').toLowerCase()) { st.className = 'mff-os mff-err'; st.textContent = 'The two emails do not match. Please check them so we can reach you.'; fe('email2').focus(); return; }
if (v('phone').replace(/\D/g, '').length < 10) { st.className = 'mff-os mff-err'; st.textContent = 'Please enter your mobile number. We text you the payment link.'; fe('phone').focus(); return; }
var lines = CART.map(function(i) { return i.q + ' x ' + i.n + ' @ ' + money(parseFloat(i.p) || 0) + ' = ' + money(i.q * (parseFloat(i.p) || 0)); }).join('\n');
var msg = 'PICKUP ORDER REQUEST (not paid, needs your confirmation)\n\n' + lines + '\n\nSubtotal: ' + money(cSubC() / 100) + '\nOnline order fee (1.5%): ' + money(cFeeC() / 100) + '\nEstimated total: ' + money(cTotal()) + ' (before any sales tax)\n\nName: ' + v('name') + '\nEmail: ' + v('email') + '\nPhone (TEXT the payment link): ' + v('phone') + '\nPreferred pickup: ' + (v('pickup') || '-') + '\nNotes: ' + (v('notes') || '-') + '';
btn.disabled = true; btn.textContent = 'Sending…';
var ref = 'W' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
var items = CART.map(function(i) { return { n: i.n, p: i.p, q: i.q }; });
var jobs = [];
if (USE_SHEET) jobs.push(fetch(ORDER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ref: ref, name: v('name'), email: v('email'), phone: v('phone'), pickup: v('pickup'), notes: v('notes'), items: items, botcheck: '' }) })
.then(function(r) { return r.json(); }).then(function(j) { return { ok: !!(j && j.ok), id: j && j.id }; }).catch(function() { return { ok: false }; }));
if (USE_MAIL) jobs.push(fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ access_key: ORDER_KEY, subject: 'New pickup order request — ' + v('name') + ' (' + money(cTotal()) + ')', from_name: 'Malabar Feed website', name: v('name'), email: v('email'), phone: v('phone'), message: msg + '\n\nRef: ' + ref }) })
.then(function(r) { return r.json(); }).then(function(j) { return { ok: !!(j && j.success) }; }).catch(function() { return { ok: false }; }));
Promise.all(jobs).then(function(rs) {
var good = rs.filter(function(r) { return r.ok; });
if (!good.length) throw new Error('fail');
var num = ''; good.forEach(function(r) { if (r.id) num = r.id; });
var em = v('email'), ph = v('phone'); CART = []; cSave(); opPill();
opEl.innerHTML = '<div class="mff-op-h"><span>Order request sent</span><button type="button" data-d="close">Close &#10005;</button></div><div class="mff-done"><h3>Thank you, ' + escapeHtml(v('name') || 'friend') + '!</h3>' + (num ? '<p>Your request number is <b>' + escapeHtml(num) + '</b>.</p>' : '') + '<p>We got your request. If everything is in stock, we will <b>text a Square payment link</b> to <b>' + escapeHtml(ph) + '</b> shortly, during business hours (Mon&ndash;Fri 8:30&ndash;5:30, Sat 8&ndash;4).</p><p>If something is out of stock, we will email <b>' + escapeHtml(em) + '</b>.</p><p>Nothing has been charged yet.</p><p><b>Please pay promptly.</b> Inventory changes, and items are not set aside until the payment is received.</p></div>';
mffGo(opEl);
}).catch(function() { btn.disabled = false; btn.textContent = 'Send order request'; st.className = 'mff-os mff-err'; st.textContent = 'Sorry, that did not go through. Please try again, or call us and we will take your order.'; });
}
